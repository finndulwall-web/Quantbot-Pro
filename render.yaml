services:
  - type: web
    name: quantbot-pro
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements-render.txt
    startCommand: python main.py --mode paper --symbol BTC/USDT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: MODE
        value: "paper"
      - key: SYMBOL
        value: "BTC/USDT"
      - key: WEBHOOK_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

# Cron job removed from blueprint - add manually after deployment via Render Dashboard
# Schedule: */10 * * * *
# Command: curl -f https://YOUR_APP_NAME.onrender.com/api/health || exit 1
