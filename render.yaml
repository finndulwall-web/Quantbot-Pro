services:
  - type: web
    name: quantbot-pro
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python main.py --mode paper --symbol BTC/USDT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: MODE
        value: "paper"
      - key: SYMBOL
        value: "BTC/USDT"
      - key: WEBHOOK_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

  - type: cron
    name: quantbot-keepalive
    schedule: "*/10 * * * *"
    command: curl -f https://quantbot-pro.onrender.com/api/health || exit 1
    envVars:
      - key: TARGET_URL
        value: https://quantbot-pro.onrender.com/api/health
